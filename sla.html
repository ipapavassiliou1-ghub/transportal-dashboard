<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Transportal SLA</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
body {
  font-family: system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:#f5f7fb;
  margin:0;
  padding:28px;
}

/* HEADER */
.topbar {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;   /* 🔥 fix */
  gap:12px;
  margin-bottom:18px;       /* 🔥 match dashboard */
}

h1 {
  margin:0 0 6px;
  font-size:34px;           /* 🔥 exact match */
  letter-spacing:-0.02em;
}

.subtitle {
  margin:0;
  color:#6b7280;
  font-size:15px;           /* 🔥 match */
}

.btnGhost {
  background:#fff;
  border:1px solid #e5e7eb;
  color:#111827;
  box-shadow:0 10px 30px rgba(0,0,0,0.06);
}

#userInfo {
  font-size:13px;
  color:#6b7280;
  font-weight:500;
}
  
/* CONTROLS */
.controlsRow {
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:20px;
}

.pillClient {
  background:#eef2ff;
  color:#4f46e5;
  font-weight:700;
  padding:10px 16px;
  border-radius:14px;
}

/* FORM */
.card {
  background:white;
  padding:18px;
  border-radius:14px;
  box-shadow:0 10px 25px rgba(0,0,0,0.05);
  margin-bottom:20px;
}

input {
  padding:8px;
  margin-right:10px;
  border-radius:8px;
  border:1px solid #ddd;
}

button {
  padding:10px 14px;
  border:none;
  border-radius:12px;
  font-weight:900;
  cursor:pointer;
  transition: transform .08s ease, opacity .2s ease;
}

button:active {
  transform: translateY(1px);
}

td button {
  padding:8px 14px;
  border-radius:10px;
  font-weight:700;
  background:#f3f4f6;
  display:inline-block;     /* 🔥 stabilizes alignment */
}
  
.btnPrimary {
  background:#2563eb;
  color:white;
}

.btnSecondary {
  background:white;
  border:1px solid #ddd;
}

/* TABLE */
table {
  width:100%;
  border-collapse:collapse;
}

td {
  padding:12px 10px;
  border-bottom:1px solid #f1f5f9;
  vertical-align:middle;    /* 🔥 important */
}

th {
  text-align:left;
  font-size:13px;
  font-weight:700;          /* 🔥 stronger */
  color:#111827;            /* 🔥 black like dashboard */
  padding:12px 10px;
  border-bottom:1px solid #e5e7eb;
}

th:last-child,
td:last-child {
  text-align:center;        /* 🔥 center header + button */
}
  
tr:hover {
  background:#f9fafb;
  cursor:pointer;
}

.inactive {
  opacity:0.4;
}

th {
  font-size:13px;
}

td {
  font-size:14px;
  font-weight:500;      /* 🔥 subtle polish */
}

.statusPill {
  display:inline-block;
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;         /* 🔥 controlled size */
  font-weight:700;
}

.statusPill.active {
  background:#dcfce7;
  color:#166534;
}

.statusPill.inactive {
  background:#f3f4f6;
  color:#6b7280;
}
  
/* FOOTER */
.footer {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
  margin-top:44px;
  font-size:14px;
  color:#6b7280;
}

.footer .brand {
  font-size:20px;
  font-weight:950;
  color:#6d28d9;
}

/* MOBILE FRIENDLY */
  
@media (max-width: 768px) {

  /* PAGE */
  body {
    padding:18px;
  }

  /* HEADER */
  .topbar {
    flex-direction:column;
    align-items:flex-start;
    gap:10px;
  }

  .topbar > div:last-child {
    width:100%;
    display:flex;
    gap:10px;
  }

  .btnGhost {
    flex:1;
  }

  #userInfo {
    width:100%;
    margin-bottom:6px;
  }

  /* CLIENT PILL */
  .controlsRow {
    flex-direction:column;
    align-items:stretch;
  }

  .pillClient {
    width:100%;
    text-align:center;
  }

  /* FORM */
  .card input {
    width:100%;
    margin-bottom:10px;
  }

  .card button {
    width:100%;
    margin-top:6px;
  }

  /* 🔥 TABLE → STACK MODE */
  table,
  thead,
  tbody,
  th,
  td,
  tr {
    display:block;
    width:100%;
  }

  thead {
    display:none;   /* hide headers */
  }

  tr {
    background:white;
    border-radius:12px;
    padding:12px;
    margin-bottom:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.05);
  }

  td {
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    border:none;
    font-size:14px;
  }

  td::before {
    font-weight:600;
    color:#6b7280;
  }

  /* 🔥 LABELS (CRITICAL) */
  td:nth-child(1)::before { content:"Carrier"; }
  td:nth-child(2)::before { content:"Service"; }
  td:nth-child(3)::before { content:"SLA Days"; }
  td:nth-child(4)::before { content:"Active"; }
  td:nth-child(5)::before { content:"Action"; }

  /* BUTTON */
  td:last-child {
    justify-content:flex-end;
  }

}
  
</style>
</head>

<body>

<!-- HEADER -->
<div class="topbar">
  <div>
    <h1>⚙ SLA Configuration</h1>
    <p class="subtitle">Define SLA rules per carrier</p>
  </div>

  <div style="display:flex; align-items:center; gap:12px;">
    <span id="userInfo"></span>
    <button onclick="goDashboard()" class="btnGhost">Dashboard</button>
    <button onclick="logout()" class="btnGhost">Logout</button>
  </div>
</div>

<!-- CLIENT -->
<div class="controlsRow">
  <div class="pillClient" id="clientDisplay">Client</div>
</div>

<!-- FORM -->
<div class="card">

  <div id="editModeLabel" style="color:#16a34a; font-weight:700; margin-bottom:10px;"></div>

  <input id="slaCarrier" placeholder="Carrier (FEDEX)" />
  <input id="slaService" placeholder="Service (STANDARD)" />
  <input id="slaDays" type="number" placeholder="Days" />

  <label>
    Active <input type="checkbox" id="slaActive" checked />
  </label>

  <button class="btnPrimary" onclick="saveSlaRule()">Save</button>
  <button class="btnSecondary" onclick="clearForm()">Clear</button>

</div>

<!-- TABLE -->
<div class="card">
  <table id="slaTable">
    <thead>
      <tr>
        <th>Carrier</th>
        <th>Service</th>
        <th>SLA Days</th>
        <th>Active</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- FOOTER -->
<div class="footer">
  powered by <span class="brand">transportal</span>
</div>

<script>

/* =============================
   🔐 AUTH PROTECTION
============================= */
function checkAuth() {
  const token = localStorage.getItem("token");

  if (!token) {
    window.location.href = "/login.html";
    return;
  }
}

/* =============================
   👤 USER HEADER
============================= */
function hydrateUserHeader() {
  document.getElementById("userInfo").textContent =
    "👤 " + (localStorage.getItem("user_email") || "Unknown");

  document.getElementById("clientDisplay").textContent =
    localStorage.getItem("display_name") || "Client";
}

/* =============================
   🔗 NAV
============================= */
function goDashboard() {
  window.location.href = "/dashboard.html";
}

function logout() {
  localStorage.clear();
  window.location.href = "/login.html";
}

/* =============================
   🌐 API CONFIG (AUTH!)
============================= */
const API_BASE = "https://api.transportal.gr";

function authFetch(url, options = {}) {
  return fetch(API_BASE + url, {
    ...options,
    headers: {
      ...(options.headers || {}),
      Authorization: "Bearer " + localStorage.getItem("token"),
      "x-api-key": localStorage.getItem("client_key"),
      "Content-Type": "application/json"
    }
  });
}

let editingId = null;
let slaRules = [];

/* =============================
   📥 LOAD SLA RULES
============================= */
async function loadSlaRules() {

  try {
    const res = await authFetch("/api/v1/sla-rules");

    if (!res.ok) {
      console.error("SLA LOAD FAILED:", res.status);
      return;
    }

    slaRules = await res.json();

    const tbody = document.querySelector("#slaTable tbody");
    tbody.innerHTML = "";

    slaRules.forEach(r => {
      const tr = document.createElement("tr");

      if (r.is_active == 0) {
        tr.classList.add("inactive");
      }

      tr.innerHTML = `
        <td>${r.carrier}</td>
        <td>${r.service}</td>
        <td>${r.sla_days}</td>
        <td>
          <span class="statusPill ${r.is_active ? "active" : "inactive"}">
          ${r.is_active ? "Active" : "Inactive"}
         </span>
       </td>
        <td>
          <button onclick="event.stopPropagation(); toggleActive(${r.id}, ${r.is_active})">
            ${r.is_active ? "Deactivate" : "Activate"}
          </button>
        </td>
      `;

      tr.onclick = () => editSla(r);

      tbody.appendChild(tr);
    });

  } catch (err) {
    console.error("SLA LOAD ERROR:", err);
  }
}

/* =============================
   💾 SAVE SLA
============================= */
async function saveSlaRule() {

  const carrier = document.getElementById("slaCarrier").value.trim().toUpperCase();
  const service = (document.getElementById("slaService").value.trim() || "STANDARD").toUpperCase();
  const sla_days = Number(document.getElementById("slaDays").value);
  const is_active = document.getElementById("slaActive").checked ? 1 : 0;

  if (!carrier || !sla_days) {
    alert("Carrier and SLA days are required");
    return;
  }

  const duplicate = slaRules.find(r =>
    r.carrier === carrier &&
    r.service === service &&
    r.id !== editingId
  );

  if (duplicate) {
    alert("Rule already exists");
    return;
  }

  const payload = { carrier, service, sla_days, is_active };

  const url = editingId
    ? `/api/v1/sla-rules/${editingId}`
    : `/api/v1/sla-rules`;

  const method = editingId ? "PUT" : "POST";

  await authFetch(url, {
    method,
    body: JSON.stringify(payload)
  });

  editingId = null;
  clearForm();
  loadSlaRules();
}

/* =============================
   ✏ EDIT
============================= */
function editSla(r) {
  editingId = r.id;

  document.getElementById("slaCarrier").value = r.carrier;
  document.getElementById("slaService").value = r.service;
  document.getElementById("slaDays").value = r.sla_days;
  document.getElementById("slaActive").checked = r.is_active == 1;

  document.getElementById("editModeLabel").innerText =
    `Editing: ${r.carrier} / ${r.service}`;
}

/* =============================
   🔄 CLEAR
============================= */
function clearForm() {
  editingId = null;

  document.getElementById("slaCarrier").value = "";
  document.getElementById("slaService").value = "";
  document.getElementById("slaDays").value = "";
  document.getElementById("slaActive").checked = true;

  document.getElementById("editModeLabel").innerText = "";
}

/* =============================
   🔁 TOGGLE ACTIVE
============================= */
async function toggleActive(id, current) {

  const rule = slaRules.find(r => r.id === id);
  if (!rule) return;

  await authFetch(`/api/v1/sla-rules/${id}`, {
    method: "PUT",
    body: JSON.stringify({
      ...rule,
      is_active: current ? 0 : 1
    })
  });

  loadSlaRules();
}

/* =============================
   🚀 INIT
============================= */
checkAuth();
hydrateUserHeader();
loadSlaRules();

</script>

</body>
</html>
